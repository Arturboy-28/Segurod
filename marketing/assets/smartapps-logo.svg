<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="SmartApps">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6BCB"/>
      <stop offset="45%" stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#E0118A"/>
    </linearGradient>
  </defs>
  <!-- squircle frame -->
  <rect x="8" y="18" width="124" height="124" rx="28" ry="28" fill="none" stroke="url(#g)" stroke-width="10"/>
  <!-- phone -->
  <rect x="42" y="36" width="56" height="88" rx="10" ry="10" fill="none" stroke="url(#g)" stroke-width="6"/>
  <!-- app grid -->
  <g fill="url(#g)">
    <rect x="52" y="50" width="10" height="10" rx="2"/>
    <rect x="65" y="50" width="10" height="10" rx="2"/>
    <rect x="78" y="50" width="10" height="10" rx="2"/>
    <rect x="52" y="63" width="10" height="10" rx="2"/>
    <rect x="65" y="63" width="10" height="10" rx="2"/>
    <rect x="78" y="63" width="10" height="10" rx="2"/>
    <rect x="52" y="76" width="10" height="10" rx="2"/>
    <rect x="65" y="76" width="10" height="10" rx="2"/>
    <rect x="78" y="76" width="10" height="10" rx="2"/>
  </g>
  <!-- ribbon -->
  <path d="M8 118c22-2 38-8 52-18 10 14 28 24 52 28H36c-10 0-18-4-28-12z" fill="url(#g)" opacity="0.95"/>
  <!-- wordmark -->
  <text x="160" y="78" font-family="Montserrat, Arial Black, sans-serif" font-size="44" font-weight="800" font-style="italic" fill="url(#g)" letter-spacing="1">SMART</text>
  <text x="160" y="128" font-family="Montserrat, Arial Black, sans-serif" font-size="44" font-weight="800" font-style="italic" fill="url(#g)" letter-spacing="1">APPS</text>
</svg>
